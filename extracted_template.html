  <style>/* Hafta Recommendations — Newslaundry-tone styling.
 * White/cream canvas. Hairlines. Single red accent. Density over whitespace. */

:root {
  --red: #E8332E;
  --red-deep: #B91A16;
  --red-ink: #7A1A18;
  --ink: #111111;
  --ink-2: #1A1A1A;
  --ink-soft: #3A3A3A;
  --paper: #FFFFFF;
  --cream: #FAF7F2;
  --cream-2: #F3EFE7;
  --hair: rgba(0, 0, 0, 0.12);
  --hair-strong: rgba(0, 0, 0, 0.22);
  --hair-soft: rgba(0, 0, 0, 0.06);
  --shade: rgba(0, 0, 0, 0.04);

  --font-serif: "Source Serif 4", "Source Serif Pro", "PT Serif", "Times New Roman", serif;
  --font-sans: "Inter", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }

button { font-family: inherit; cursor: pointer; }

/* ============ MASTHEAD ============ */
.masthead {
  border-bottom: 1px solid var(--hair-strong);
  background: var(--paper);
}
.masthead-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 28px 32px 24px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  gap: 48px;
  align-items: end;
}
.pretitle {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.pretitle .dot { width: 5px; height: 5px; background: var(--red); border-radius: 50%; display: inline-block; }
.wordmark {
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: 64px;
  line-height: 0.95;
  letter-spacing: -0.025em;
  margin: 0 0 16px;
  color: var(--ink);
}
.wordmark .slash { color: var(--red); font-style: italic; font-weight: 400; padding: 0 4px; }
.wordmark .accent { color: var(--red); font-style: italic; font-weight: 600; }
.lede {
  max-width: 720px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink-2);
  margin: 0;
}
.lede .key { font-family: var(--font-mono); font-size: 12.5px; background: var(--cream); padding: 1px 6px; border: 1px solid var(--hair); }
.lede .arrow { color: var(--red); font-weight: 600; }

.stats-strip {
  border: 1px solid var(--hair-strong);
  padding: 18px 20px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0;
}
.stat { padding: 0 14px; border-left: 1px solid var(--hair); }
.stat:first-child { padding-left: 0; border-left: none; }
.stat .num {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 600;
  line-height: 1;
  color: var(--ink);
  letter-spacing: -0.02em;
}
.stat .lab {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 6px;
}

/* ============ COMMAND BAR ============ */
.cmd-bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--hair-strong);
}
.cmd-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 12px 32px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.cmd-search {
  position: relative;
  flex: 1 1 320px;
  min-width: 240px;
}
.cmd-search input {
  width: 100%;
  border: 1px solid var(--hair-strong);
  background: var(--paper);
  font-family: var(--font-sans);
  font-size: 14px;
  padding: 10px 14px 10px 36px;
  color: var(--ink);
  outline: none;
  border-radius: 0;
}
.cmd-search input:focus { border-color: var(--red); }
.cmd-search .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-soft);
  pointer-events: none;
}
.cmd-search .kbd {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-soft);
  border: 1px solid var(--hair);
  padding: 1px 6px;
  background: var(--cream);
  pointer-events: none;
}

.cmd-select {
  position: relative;
}
.cmd-select select {
  appearance: none;
  -webkit-appearance: none;
  font-family: var(--font-sans);
  font-size: 13px;
  border: 1px solid var(--hair-strong);
  background: var(--paper);
  color: var(--ink);
  padding: 10px 30px 10px 14px;
  border-radius: 0;
  cursor: pointer;
  min-width: 140px;
}
.cmd-select::after {
  content: "▾";
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  font-size: 11px;
  color: var(--ink-soft);
}
.cmd-select select:focus { outline: none; border-color: var(--red); }

.view-toggle {
  display: flex;
  border: 1px solid var(--hair-strong);
}
.view-toggle button {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--paper);
  border: none;
  padding: 10px 14px;
  color: var(--ink-soft);
  border-left: 1px solid var(--hair);
}
.view-toggle button:first-child { border-left: none; }
.view-toggle button.active { background: var(--ink); color: var(--paper); }

/* ============ TYPE STRIP ============ */
.type-strip {
  border-bottom: 1px solid var(--hair);
  background: var(--cream);
}
.type-strip-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 12px 32px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.type-strip .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-right: 6px;
}
.type-pill {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border: 1px solid var(--hair-strong);
  background: var(--paper);
  padding: 5px 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-2);
  cursor: pointer;
  transition: border-color 120ms;
}
.type-pill:hover { border-color: var(--ink); }
.type-pill .ct { color: var(--ink-soft); font-size: 10px; }
.type-pill.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.type-pill.active .ct { color: rgba(255,255,255,0.6); }

/* ============ ACTIVE FILTER CHIPS ============ */
.chips {
  max-width: 1320px;
  margin: 0 auto;
  padding: 12px 32px 0;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.chips .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-right: 4px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 12px;
  border: 1px solid var(--ink);
  padding: 4px 4px 4px 10px;
  background: var(--paper);
}
.chip .x {
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 12px;
  background: var(--ink); color: var(--paper);
  border: none; cursor: pointer;
  margin-left: 4px;
}
.chip .x:hover { background: var(--red); }

/* ============ HIGHLIGHT ============ */
mark.hit {
  background: transparent;
  color: var(--red);
  font-weight: 600;
  border-bottom: 1.5px solid var(--red);
  padding: 0;
}

/* ============ AVATAR ============ */
.avatar {
  font-family: var(--font-mono);
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--hair-strong);
  flex-shrink: 0;
  user-select: none;
}
.avatar.sm { width: 22px; height: 22px; font-size: 9px; letter-spacing: 0.04em; }
.avatar.md { width: 32px; height: 32px; font-size: 11px; letter-spacing: 0.04em; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; letter-spacing: 0.02em; }
.avatar.xl { width: 88px; height: 88px; font-size: 30px; letter-spacing: 0.02em; }

/* ============ CARDS GRID ============ */
.main {
  max-width: 1320px;
  margin: 0 auto;
  padding: 22px 32px 80px;
}
.cards-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 0;
  border-top: 1px solid var(--hair-strong);
  border-left: 1px solid var(--hair-strong);
}
.card {
  grid-column: span 4;
  border-right: 1px solid var(--hair-strong);
  border-bottom: 1px solid var(--hair-strong);
  padding: 18px 20px 14px;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  min-height: 220px;
  position: relative;
  opacity: 0;
  transform: translateY(4px);
  animation: cardIn 220ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.card.feature {
  grid-column: span 8;
  background: var(--cream);
  min-height: 260px;
}
.card.feature.full {
  grid-column: span 12;
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 14px;
}
.episode-tag {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--hair);
  padding: 2px 7px;
  cursor: pointer;
  background: var(--paper);
  white-space: nowrap;
}
.episode-tag:hover { border-color: var(--ink); color: var(--ink); }
.card.feature .episode-tag { background: var(--paper); }

.panellist-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  text-align: right;
}
.panellist-tab .name {
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
}
.panellist-tab:hover .name { color: var(--red); }

.type-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--red);
  font-weight: 600;
  margin-bottom: 8px;
}
.card.feature .type-badge::before {
  content: "";
  display: block;
  width: 32px;
  height: 2px;
  background: var(--red);
  margin-bottom: 8px;
}

.card-title {
  font-family: var(--font-serif);
  font-size: 19px;
  line-height: 1.22;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--ink);
  margin: 0 0 14px;
  text-wrap: pretty;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-title:hover {
  text-decoration: underline;
  text-decoration-color: var(--red);
  text-decoration-thickness: 2px;
  text-underline-offset: 4px;
}
.card.feature .card-title {
  font-size: 30px;
  line-height: 1.1;
  font-style: italic;
  font-weight: 500;
  -webkit-line-clamp: 5;
}
.card.feature.full .card-title { font-size: 38px; }

.card-actions {
  margin-top: auto;
  border-top: 1px solid var(--hair);
  display: flex;
  gap: 0;
  padding-top: 10px;
}
.btn-action {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: transparent;
  border: none;
  border-right: 1px solid var(--hair);
  padding: 6px 4px;
  color: var(--ink-soft);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.btn-action:last-child { border-right: none; }
.btn-action:hover { color: var(--red); background: var(--cream-2); }
.btn-action.primary { color: var(--ink); font-weight: 600; }
.btn-action.primary:hover { color: var(--paper); background: var(--red); }

/* ============ EMPTY STATE ============ */
.empty {
  border: 1px solid var(--hair-strong);
  padding: 60px 32px;
  text-align: center;
  background: var(--cream);
}
.empty .h {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 36px;
  color: var(--ink);
  margin: 0 0 8px;
}
.empty .sub {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

/* ============ EPISODES VIEW ============ */
.episode-block {
  border: 1px solid var(--hair-strong);
  margin-bottom: 22px;
  background: var(--paper);
}
.episode-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 24px;
  align-items: center;
  padding: 22px 26px;
  border-bottom: 1px solid var(--hair-strong);
  background: var(--cream);
}
.episode-num {
  font-family: var(--font-serif);
  font-style: italic;
  font-weight: 600;
  font-size: 64px;
  color: var(--red);
  line-height: 0.85;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.episode-num.special {
  font-size: 28px;
  font-style: italic;
  font-weight: 500;
  line-height: 1.1;
  max-width: 400px;
}
.episode-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.episode-meta strong { color: var(--ink); font-weight: 600; }
.episode-meta .sep { color: var(--hair-strong); margin: 0 8px; }

.btn-watch {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: var(--ink);
  color: var(--paper);
  border: 1px solid var(--ink);
  padding: 10px 16px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.btn-watch:hover { background: var(--red); border-color: var(--red); }
.btn-watch.open { background: var(--red); border-color: var(--red); }

.embed-wrap {
  border-bottom: 1px solid var(--hair-strong);
  background: var(--ink);
  padding: 0;
}
.embed-aspect {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
}
.embed-aspect iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.episode-body {
  display: grid;
  grid-template-columns: 240px 1fr;
}
.ep-panellist-row {
  display: contents;
}
.ep-panellist-cell {
  border-top: 1px solid var(--hair);
  padding: 18px 22px;
  background: var(--cream-2);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.ep-panellist-cell:first-child { border-top: none; }
.ep-recs-cell {
  border-top: 1px solid var(--hair);
  border-left: 1px solid var(--hair);
  padding: 14px 22px;
}
.ep-recs-cell:first-of-type { border-top: none; }

.ep-pname {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ep-pname:hover { color: var(--red); }
.ep-prole {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  line-height: 1.3;
}
.ep-pview {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--red);
  background: none;
  border: none;
  padding: 0;
  text-align: left;
  margin-top: auto;
  cursor: pointer;
}
.ep-pview:hover { text-decoration: underline; }

.ep-rec {
  display: grid;
  grid-template-columns: 28px auto 1fr auto;
  gap: 14px;
  align-items: baseline;
  padding: 9px 0;
  border-bottom: 1px dotted var(--hair);
}
.ep-rec:last-child { border-bottom: none; }
.ep-rec-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-soft);
}
.ep-rec-type {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--red);
  font-weight: 600;
  white-space: nowrap;
}
.ep-rec-title {
  font-family: var(--font-serif);
  font-size: 16px;
  line-height: 1.3;
  color: var(--ink);
  font-weight: 500;
}
.ep-rec-title:hover { text-decoration: underline; text-decoration-color: var(--red); }
.ep-rec-actions {
  display: flex;
  gap: 4px;
}
.ep-rec-actions a {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--hair);
  padding: 3px 6px;
}
.ep-rec-actions a:hover { color: var(--red); border-color: var(--red); text-decoration: none; }

/* ============ MODAL ============ */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(15, 15, 15, 0.55);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 32px;
  animation: backdropIn 180ms ease-out;
}
@keyframes backdropIn { from { opacity: 0; } }
.modal {
  background: var(--paper);
  border: 1px solid var(--hair-strong);
  width: 100%;
  max-width: 760px;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  animation: modalIn 240ms cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(8px); } }
.modal-head {
  padding: 26px 30px 22px;
  border-bottom: 1px solid var(--hair);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 22px;
  align-items: start;
}
.modal-head-text { display: flex; flex-direction: column; gap: 4px; }
.modal-name {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.05;
  color: var(--ink);
  margin: 0;
}
.modal-role {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--red);
  margin-top: 8px;
}
.modal-bio {
  font-family: var(--font-serif);
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--ink-2);
  margin: 14px 0 0;
  text-wrap: pretty;
}
.modal-bio.placeholder {
  font-style: italic;
  color: var(--ink-soft);
}
.btn-close {
  border: 1px solid var(--hair-strong);
  background: var(--paper);
  width: 36px;
  height: 36px;
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--ink);
}
.btn-close:hover { background: var(--ink); color: var(--paper); }

.modal-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-bottom: 1px solid var(--hair);
}
.modal-stats .stat {
  border-left: 1px solid var(--hair);
  padding: 14px 22px;
}
.modal-stats .stat:first-child { border-left: none; }
.modal-stats .num {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 600;
  color: var(--ink);
}

.modal-body {
  overflow-y: auto;
  padding: 0;
}
.modal-section-rule {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 30px 10px;
}
.modal-section-rule::before {
  content: "";
  width: 18px;
  height: 2px;
  background: var(--red);
}
.modal-section-rule .lab {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.history-row {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 14px;
  align-items: baseline;
  padding: 10px 30px;
  border-top: 1px solid var(--hair-soft);
}
.history-row:hover { background: var(--cream); }
.history-row .hep {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--hair);
  padding: 2px 7px;
  background: var(--paper);
  cursor: pointer;
  white-space: nowrap;
}
.history-row .hep:hover { color: var(--red); border-color: var(--red); }
.history-row .htype {
  font-family: var(--font-mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--red);
  font-weight: 600;
}
.history-row .htitle {
  font-family: var(--font-serif);
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.history-row .htitle:hover { text-decoration: underline; text-decoration-color: var(--red); }
.history-row .hicons {
  display: flex; gap: 4px;
}
.history-row .hicons a {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  border: 1px solid var(--hair);
  padding: 2px 5px;
}
.history-row .hicons a:hover { color: var(--red); border-color: var(--red); }

/* ============ FOOTER ============ */
.footer {
  border-top: 1px solid var(--hair-strong);
  background: var(--cream);
  padding: 20px 32px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: center;
}
